name: Deploy AprovaLab Estudos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate materials catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("materiais.json").read_text(encoding="utf-8"))
          if not isinstance(data.get("materials"), list):
              raise SystemExit("materiais.json precisa conter uma lista 'materials'.")
          print(f"Catálogo válido: {len(data['materials'])} material(is).")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
